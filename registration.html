<!DOCTYPE html> 
<html>
    <head>
        <title>A'tin19 | Registration</title>
        <link rel="stylesheet" href="webstyle.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="account">
<nav class="navbar"> <ul>
      <li><a href = "home.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
</ul> </nav>
<br>
<main>
<main class="login-main" id="registration">
    <div class="loginbox">
        <h2>Join A'TIN19!</h2>
        <p class="login-description">
            Create your account and join the fandom.
        </p>

        <form action="/cgi-bin/html5.cgi" method="post">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter your name"
                    required class="input">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email"
                    required class="input">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create a password"
                    required class="input">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required class="input">
            </div>

            <fieldset class="house-options">
    <legend>Select Your House</legend>

    <div class="house-grid">

        <label class="house-box">
            <input type="radio" name="house"
                value="freezer" required>
            <img src="images/pablo/pablo_house.webp"
                alt="Taga-freezer house">
            <span>Taga-freezer</span>
        </label>

        <label class="house-box">
            <input type="radio" name="house"
                value="maisan">
            <img src="images/justin/justin_house.webp"
                alt="Taga-maisan house">
            <span>Taga-maisan</span>
        </label>

        <label class="house-box">
            <input type="radio" name="house"
                value="ihawan">
            <img src="images/josh/josh_house.webp"
                alt="Taga-ihawan house">
            <span>Taga-ihawan</span>
        </label>

        <label class="house-box">
            <input type="radio" name="house"
                value="farm">
            <img src="images/stell/stell_house.webp"
                alt="Taga-farm house">
            <span>Taga-farm</span>
        </label>
        
        <label class="house-box">
            <input type="radio" name="house"
                value="manukan">
            <img src="images/ken/ken_house.webp"
                alt="Taga-manukan house">
            <span>Taga-manukan</span>
        </label>

    </div>
</fieldset>
            <input type="submit" value="Create Account"
                class="login-button">

        </form>

        <p class="register-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</main>
</main>
